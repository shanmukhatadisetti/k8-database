apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: roboshop
  labels:
    component: redis 
    env: dev
    project: roboshop
spec:
  ports:
    - protocol: TCP 
      port: 6379
      targetPort: 6379
  clusterIP: None
  selector:
    component: redis 
    env: dev
    project: roboshop
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: roboshop
  labels:
    component: redis 
    env: dev
    project: roboshop
spec:
  selector:
    component: redis 
    env: dev
    project: roboshop
  ports:
    - protocol: TCP 
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: roboshop
spec:
  selector:
    matchLabels:
      component: redis 
      env: dev
      project: roboshop
  serviceName: "redis-headless"
  replicas: 3 # by default is 1
  template:
    metadata:
      labels:
        component: redis 
        env: dev
        project: roboshop # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: redis
        image: redis:7.0
        volumeMounts:
        - name: redis-pvc
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-pvc
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 2Gi