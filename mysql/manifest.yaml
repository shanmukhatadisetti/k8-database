apiVersion: v1
kind: Secret
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    env: dev 
    tier: database
type: opaque 
data:
  MYSQL_ROOT_PASSWORD: "Um9ib1Nob3BAMQ=="
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
  labels:
    component: mongodb 
    env: dev
    project: roboshop
spec:
  ports:
    - protocol: TCP 
      port: 27017   
      targetPort: 27017
  clusterIP: None
  selector:
    component: mongodb 
    env: dev
    project: roboshop
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: roboshop
  labels:
    component: mongodb 
    env: dev
    project: roboshop
spec:
  selector:
    component: mongodb 
    env: dev
    project: roboshop
  ports:
    - protocol: TCP 
      port: 27017   
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    matchLabels:
      component: mongodb 
      env: dev
      project: roboshop
  serviceName: "mongodb-headless"
  replicas: 3 # by default is 1
  template:
    metadata:
      labels:
        component: mongodb 
        env: dev
        project: roboshop # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: mongodb
        image: shanmukhatadisetti/mongodb:v1
        envFrom:
          - secretRef:
              name: mysql
        volumeMounts:
        - name: mongodb-pvc
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-pvc
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 2Gi