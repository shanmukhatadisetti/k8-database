apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  labels:
    component: user
    project: roboshop
    env: dev
    tier: app
data:
  MONGO: "true" 
  REDIS_URL: "redis://redis:6379" 
  MONGO_URL: "mongodb://mongodb:27017/users"
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: user 
  labels:
    component: user
    project: roboshop
    env: dev
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      component: user
      project: roboshop
      env: dev
      tier: app
  template:
    metadata:
      labels:
        component: user
        project: roboshop
        env: dev
        tier: app
    spec:
      containers:
        - name: user
          image: shanmukhatadisetti/user:v1
          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          envFrom:
          - configMapRef:
              name: user
---
apiVersion: v1
kind: Service
metadata:
  name: user
  labels: 
    component: user
    project: roboshop
    env: dev
    tier: app
spec:
  selector:
    component: user
    project: roboshop
    env: dev
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10 