apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop
  labels:
    component: shipping
    project: roboshop
    env: dev
    tier: app
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: shipping
  namespace: roboshop 
  labels:
    component: shipping
    project: roboshop
    env: dev
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      component: shipping
      project: roboshop
      env: dev
      tier: app
  template:
    metadata:
      labels:
        component: shipping
        project: roboshop
        env: dev
        tier: app
    spec:
      containers:
        - name: shipping
          image: shanmukhatadisetti/shipping:v1
          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          envFrom:
          - configMapRef:
              name: shipping
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
  labels: 
    component: shipping
    project: roboshop
    env: dev
    tier: app
spec:
  selector:
    component: shipping
    project: roboshop
    env: dev
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10 