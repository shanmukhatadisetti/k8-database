apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
  labels:
    component: payment
    project: roboshop
    env: dev
    tier: app
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment
  namespace: roboshop
  labels:
    component: payment
    project: roboshop
    env: dev 
    tier: app
type: opaque 
data:
  AMQP_USER: "cm9ib3Nob3A="
  AMQP_PASS: "cm9ib3Nob3AxMjM="
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: payment 
  namespace: roboshop
  labels:
    component: payment
    project: roboshop
    env: dev
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      component: payment
      project: roboshop
      env: dev
      tier: app
  template:
    metadata:
      labels:
        component: payment
        project: roboshop
        env: dev
        tier: app
    spec:
      containers:
        - name: payment
          image: shanmukhatadisetti/payment:v1
          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          envFrom:
          - configMapRef:
              name: payment
          - secretRef:
              name: payment
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
  labels: 
    component: payment
    project: roboshop
    env: dev
    tier: app
spec:
  selector:
    component: payment
    project: roboshop
    env: dev
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10 